<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2111：晶片冒險記 - 第一章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #05070a;
    --panel: rgba(9, 14, 24, 0.92);
    --line: rgba(0, 255, 204, 0.18);
    --cyan: #00ffcc;
    --text: #e0e6ed;
    --muted: #8a97a8;
    --gold: #facc15;
    --merlin: #c084fc;
    --thought: #f8fafc;
    --danger: #f87171;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    background-image: linear-gradient(rgba(0, 255, 204, 0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 255, 204, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }

#app {
    width: 100%; max-width: 980px; max-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    position: relative;
}
@media (max-width: 640px) { #app { border-radius: 0; border: 0; height: 100dvh; } }

/* ===== HUD ===== */
#hud {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; font-size: 12px; letter-spacing: 0.08em;
    color: var(--cyan); border-bottom: 1px solid var(--line);
    flex-shrink: 0;
}
#loc { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#loc::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 50% { opacity: 0.25; } }
.hud-btn { background: none; border: 0; padding: 4px 2px; color: var(--cyan); font-size: 13px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.hud-btn:hover { color: #fff; }
#coin-hud { color: var(--gold); }
#coin-hud.pop { animation: coinPop 0.6s ease; }
@keyframes coinPop { 40% { transform: scale(1.5); color: #fff; } }
#logout-btn { color: var(--danger); display: none; }
#date { color: var(--muted); }
@media (max-width: 640px) { #date { display: none; } #hud { gap: 10px; } }

/* ===== 舞台 ===== */
#stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    overflow: hidden; flex-shrink: 0; background: #000; cursor: pointer;
}
@media (max-aspect-ratio: 1/1) { #stage { aspect-ratio: 1 / 1; max-height: 62dvh; } }
#stage > * { position: absolute; inset: 0; }
#base { transition: background 1.2s ease; }
#scene-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s ease, filter 1s ease; }
#fxc { pointer-events: none; }
#light { pointer-events: none; transition: background 1.4s ease; }
#sunglow { pointer-events: none; opacity: 0; transition: opacity 2s ease;
    background: radial-gradient(circle at 78% 8%, rgba(255, 240, 190, 0.55), rgba(255, 210, 120, 0.12) 35%, transparent 60%);
    mix-blend-mode: screen; }
#exposure { pointer-events: none; background: #fffbea; opacity: 0; }
#lids { pointer-events: none; }
#lids div { position: absolute; left: -5%; width: 110%; height: 0; background: #000; transition: height 0.35s ease; }
#lids .t { top: 0; border-radius: 0 0 50% 50% / 0 0 30% 30%; }
#lids .b { bottom: 0; border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
#ix { pointer-events: none; }
#ix > * { pointer-events: auto; }
#flash { pointer-events: none; opacity: 0; background: #fff; }
#flash.go { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
#veil { pointer-events: none; background: #000; opacity: 0; transition: opacity 0.6s ease;
    display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 0.3em; color: var(--muted); }
#veil.on { opacity: 1; }

/* 畫面特效 */
.shake { animation: shake 0.5s ease; }
@keyframes shake {
    20% { transform: translate(-8px, 4px); } 40% { transform: translate(8px, -4px); }
    60% { transform: translate(-5px, -2px); } 80% { transform: translate(5px, 2px); }
}
#glitch { pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(0deg, rgba(0, 255, 204, 0.18) 0 2px, transparent 2px 7px); }
#stage.glitching #glitch { animation: glitchBars 0.9s steps(6) ; }
#stage.glitching #scene-img { animation: glitchImg 0.9s steps(5); }
@keyframes glitchBars { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; transform: translateY(-6px); } 40%, 80% { opacity: 0.6; transform: translateY(5px); } }
@keyframes glitchImg {
    0% { filter: hue-rotate(0); transform: none; }
    25% { filter: hue-rotate(90deg) saturate(3); transform: translateX(-10px) skewX(6deg); }
    50% { filter: invert(0.8); transform: translateX(8px); clip-path: inset(20% 0 30% 0); }
    75% { filter: hue-rotate(-60deg) contrast(2); transform: translateX(-4px) skewX(-4deg); clip-path: none; }
    100% { filter: none; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
    .shake, #stage.glitching #glitch, #stage.glitching #scene-img, #flash.go { animation: none !important; }
}

/* ===== AR 標籤（可點的場景物件） ===== */
.tag {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 9px; border-radius: 999px;
    background: rgba(5, 12, 20, 0.62); border: 1px solid rgba(0, 255, 204, 0.55);
    color: #dffcf6; font-size: 13px; white-space: nowrap;
    backdrop-filter: blur(4px); transition: transform 0.15s ease, background 0.15s ease;
}
.tag:hover { background: rgba(0, 255, 204, 0.2); transform: translate(-50%, -50%) scale(1.06); }
.tag .dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; }
.tag .dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--cyan); animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.tag.gold { border-color: rgba(250, 204, 21, 0.7); color: #fff7d6; }
.tag.gold .dot, .tag.gold .dot::after { background: var(--gold); border-color: var(--gold); }
.tag.gold .dot::after { background: none; }
.tag.red { border-color: rgba(248, 113, 113, 0.7); }
.tag.red .dot { background: var(--danger); } .tag.red .dot::after { border-color: var(--danger); }
.tag.flicker { animation: flicker 3s infinite; }
@keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: 0.2; } 50% { opacity: 1; } 52% { opacity: 0.3; } 53% { opacity: 1; } }
.tag.prop { border-color: rgba(255, 255, 255, 0.28); color: #cbd5e1; font-size: 12px; padding: 5px 10px 5px 8px; }
.tag.prop .dot { width: 7px; height: 7px; background: #cbd5e1; }
.tag.prop .dot::after { border-color: #cbd5e1; animation-duration: 2.6s; }

/* ===== 全息面板 ===== */
.holo {
    position: absolute; padding: 14px 16px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(0, 40, 48, 0.78), rgba(0, 20, 28, 0.82));
    border: 1px solid rgba(0, 255, 204, 0.5);
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.18), inset 0 0 20px rgba(0, 255, 204, 0.06);
    backdrop-filter: blur(6px); color: #dffcf6;
    animation: holoIn 0.35s ease-out;
}
.holo::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 4px); }
@keyframes holoIn { from { opacity: 0; scale: 1 0.05; } to { opacity: 1; scale: 1 1; } }
@keyframes fadeIn { from { opacity: 0; } }
.holo { max-height: 96%; overflow-y: auto; }
@media (max-width: 640px) { .holo .tt { display: none; } .holo { padding: 10px 12px; } .holo h4 { margin-bottom: 3px; } }
.holo h4 { margin: 0 0 6px; font-size: 13px; color: var(--cyan); font-weight: 700; letter-spacing: 0.06em; }
.holo .big { font-size: clamp(26px, 6vw, 44px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hbtn {
    border: 1px solid rgba(0, 255, 204, 0.5); background: rgba(0, 255, 204, 0.08);
    color: #dffcf6; border-radius: 8px; padding: 9px 12px; font-weight: 700;
    transition: background 0.15s ease, transform 0.1s ease;
}
.hbtn:hover:not(:disabled) { background: rgba(0, 255, 204, 0.25); }
.hbtn:active:not(:disabled) { transform: scale(0.96); }
.hbtn:disabled { opacity: 0.35; cursor: not-allowed; }
.hbtn.on { background: var(--cyan); color: #00201a; }
.hbtn.right { background: rgba(16, 185, 129, 0.55); border-color: #34d399; color: #fff; }
.hbtn.wrong { background: rgba(239, 68, 68, 0.5); border-color: #f87171; color: #fff; }
.hbtn.gold { background: var(--gold); color: #1a1300; border-color: var(--gold); }

/* 二進位燈泡 */
.bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: clamp(4px, 1.2vw, 10px); }
.bitb { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; }
.bitb .bulb { width: clamp(28px, 7vw, 52px); aspect-ratio: 1; border-radius: 50%;
    border: 2px solid #335; background: #0b1220; display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #475569; transition: all 0.12s ease; font-size: clamp(12px, 2.6vw, 18px); }
.bitb.on .bulb { background: #fde047; border-color: #fde047; color: #1a1300; box-shadow: 0 0 22px rgba(253, 224, 71, 0.9); }
.bitb .w { font-size: 10px; color: #7dd3c0; font-variant-numeric: tabular-nums; }
.decoded { position: absolute; left: 50%; top: 78%; transform: translate(-50%, -50%);
    font-size: clamp(60px, 16vw, 140px); font-weight: 900; color: #fde047; letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(253, 224, 71, 0.9), 0 0 80px rgba(253, 224, 71, 0.5); pointer-events: none;
    animation: popIn 0.4s ease-out; }
@keyframes popIn { from { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }

/* 礦坑 */
.lever { width: 54px; height: 30px; border-radius: 999px; background: #1e293b; border: 2px solid #475569; position: relative; padding: 0; transition: all 0.2s; }
.lever::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #64748b; transition: all 0.2s; }
.lever.on { background: rgba(0, 255, 204, 0.3); border-color: var(--cyan); }
.lever.on::after { left: 27px; background: var(--cyan); }
.lamp { width: clamp(52px, 10vw, 84px); aspect-ratio: 1; border-radius: 50%; border: 3px solid #334155; background: #0b1220;
    display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 5vw, 36px); filter: grayscale(1); opacity: 0.6; transition: all 0.25s; }
.lamp.on { background: #fde047; border-color: #fde047; box-shadow: 0 0 50px rgba(253, 224, 71, 0.95); filter: none; opacity: 1; }
.slot { min-width: 76px; padding: 10px 8px; border: 2px dashed #64748b; border-radius: 8px; text-align: center; font-weight: 900; }
.slot.filled { border-style: solid; border-color: var(--cyan); color: var(--cyan); }
.tt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; text-align: center; color: #94a3b8; }
.tt div { border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 3px 0; }
.tt .cur { border-color: var(--cyan); color: #fff; }

/* 礦石 */
.rock {
    position: absolute; transform: translate(-50%, -50%);
    padding: 12px 16px; max-width: 44%; min-width: 90px; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.4;
    background: linear-gradient(145deg, #57534e, #292524); color: #f5f5f4;
    border: 2px solid #78716c; border-radius: 38% 62% 44% 56% / 52% 40% 60% 48%;
    box-shadow: inset -6px -8px 0 rgba(0, 0, 0, 0.3), 0 8px 18px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease;
}
.rock:hover { transform: translate(-50%, -50%) scale(1.05); }
.rock.hit { animation: hit 0.25s ease; }
@keyframes hit { 50% { transform: translate(-50%, -50%) rotate(-6deg) scale(0.94); } }
.rock.gem { background: linear-gradient(145deg, #fde047, #ca8a04); color: #1a1300; border-color: #fef08a; box-shadow: 0 0 30px rgba(253, 224, 71, 0.8); }
.rock.dud { opacity: 0.35; }
.coinpop { position: absolute; font-size: 28px; pointer-events: none; animation: coinUp 0.9s ease-out forwards; }
@keyframes coinUp { to { transform: translateY(-70px); opacity: 0; } }
.fuel { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.fuel > div { height: 100%; background: var(--gold); transition: width 0.1s linear; }

/* 地圖 */
.mapnode { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: #dffcf6; font-size: 12px; font-weight: 700; }
.mapnode .gem { width: 22px; height: 22px; transform: rotate(45deg); border: 2px solid var(--cyan); background: rgba(0, 255, 204, 0.18);
    box-shadow: 0 0 16px rgba(0, 255, 204, 0.6); transition: all 0.15s; }
.mapnode:hover .gem { background: var(--cyan); }
.mapnode.done .gem { border-color: var(--gold); background: rgba(250, 204, 21, 0.3); box-shadow: 0 0 16px rgba(250, 204, 21, 0.6); }
.mapnode.locked { opacity: 0.45; }
.mapnode span { background: rgba(0, 10, 16, 0.7); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }

/* 商品 */
.ware { position: absolute; transform: translate(-50%, -50%); width: 30%; max-width: 220px; text-align: center; }
.ware .icon { font-size: clamp(30px, 7vw, 54px); filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6)); }
.ware .pricetag { display: inline-block; margin-top: 4px; }
.ware.sold { opacity: 0.35; }

/* 手機 */
.phone { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(260px, 70%); text-align: center; animation: holoIn 0.3s ease-out, buzz 0.5s 0.4s infinite; }
@keyframes buzz { 0%, 100% { margin-left: 0; } 25% { margin-left: -3px; } 75% { margin-left: 3px; } }
.phone .avatar { width: 54px; height: 54px; margin: 4px auto 8px; border-radius: 50%; background: linear-gradient(135deg, #fb923c, #c2410c);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #fff; }

/* 伺服器入口 */
.portal { position: absolute; top: 50%; width: 38%; transform: translateY(-50%); text-align: left; padding: 16px; }
.portal:hover { box-shadow: 0 0 40px rgba(0, 255, 204, 0.45); }
.portal .name { font-size: clamp(15px, 2.6vw, 20px); font-weight: 900; margin: 2px 0 8px; }
.portal .meta { font-size: 11px; color: #9be9d8; line-height: 1.7; font-variant-numeric: tabular-nums; }

/* ===== 夥伴（人工智能 / 梅林）與泡泡 ===== */
#buddy {
    inset: auto; right: 4%; bottom: 8%; width: clamp(40px, 7vw, 56px); height: clamp(40px, 7vw, 56px);
    border-radius: 50%; border: 0; padding: 0; display: none; z-index: 5;
    animation: float 4s ease-in-out infinite;
}
#buddy.ai { background: radial-gradient(circle at 35% 30%, #b8fff0, #00c9a7 45%, #00473c); box-shadow: 0 0 28px rgba(0, 255, 204, 0.75); }
#buddy.merlin { background: radial-gradient(circle at 35% 30%, #f3e8ff, #a855f7 45%, #3b0764); box-shadow: 0 0 28px rgba(192, 132, 252, 0.85); }
#buddy .eyes { position: absolute; left: 26%; right: 26%; top: 40%; display: flex; justify-content: space-between; }
#buddy .eyes i { width: 18%; aspect-ratio: 1 / 1.5; min-width: 5px; background: #001a14; border-radius: 50%; animation: blink 5s infinite; }
#buddy.merlin .eyes i { background: #1e0436; }
#buddy.talk { animation: float 4s ease-in-out infinite, talk 0.25s ease-in-out infinite; }
@keyframes float { 50% { translate: 0 -8px; } }
@keyframes talk { 50% { scale: 1.08; } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
#bubble {
    inset: auto; right: 4%; bottom: calc(8% + clamp(48px, 8vw, 66px)); max-width: min(330px, 70%);
    padding: 9px 13px; border-radius: 12px 12px 4px 12px; font-size: 14px; line-height: 1.6;
    background: rgba(8, 12, 22, 0.88); border: 1px solid rgba(255, 255, 255, 0.18);
    opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; z-index: 6;
}
#bubble.show { opacity: 1; transform: none; }
#bubble.left { right: auto; left: 4%; bottom: 8%; border-radius: 12px 12px 12px 4px; }
#bubble b { display: block; font-size: 11px; margin-bottom: 2px; letter-spacing: 0.1em; }

/* AR 通知 */
#toasts { inset: auto; left: 3%; top: 4%; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 7; }
.toast { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
    background: rgba(8, 12, 22, 0.85); border-left: 3px solid var(--gold); color: #fff7d6; animation: toastIn 0.3s ease-out; }
.toast.card { border-left-color: var(--cyan); color: #dffcf6; }
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toastIn { from { transform: translateX(-20px); opacity: 0; } }

/* ===== 對話框 ===== */
#dialog { flex: 1; min-height: 150px; display: flex; flex-direction: column; padding: 14px 20px 14px; border-top: 1px solid var(--line); position: relative; overflow: hidden; cursor: pointer; }
#speaker { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 6px; min-height: 18px; }
#text-wrap { flex: 1; overflow-y: auto; min-height: 0; }
#text { font-size: clamp(16px, 2.2vw, 20px); line-height: 1.75; white-space: pre-wrap; min-height: 1.75em; }
#text.thinking { color: #cbd5e1; }
#more { position: absolute; right: 18px; bottom: 12px; color: var(--cyan); font-size: 12px; opacity: 0; animation: bob 1s ease-in-out infinite; }
#more.on { opacity: 0.85; }
@keyframes bob { 50% { transform: translateY(4px); } }
#hint { font-size: 12px; color: #7dd3c0; margin-top: 6px; min-height: 18px; letter-spacing: 0.04em; }
#hint:not(:empty)::before { content: '◇ '; }
#choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.choice { padding: 9px 14px; font-size: 15px; text-align: left; transition: all 0.15s ease; animation: choiceIn 0.3s ease-out backwards; }
@keyframes choiceIn { from { opacity: 0; transform: translateY(6px); } }
.choice.thought { background: rgba(248, 250, 252, 0.06); border: 1px dashed rgba(248, 250, 252, 0.35); border-radius: 18px; color: var(--thought); }
.choice.thought:hover { background: rgba(248, 250, 252, 0.14); }
.choice.holo-c { background: rgba(0, 255, 204, 0.07); border: 1px solid rgba(0, 255, 204, 0.45); border-radius: 6px; color: #dffcf6; box-shadow: 0 0 14px rgba(0, 255, 204, 0.12); }
.choice.holo-c:hover { background: rgba(0, 255, 204, 0.2); }
.choice .k { opacity: 0.5; margin-right: 6px; font-size: 12px; }
#name-row { display: flex; gap: 8px; margin-top: 10px; }
#name-input { flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--merlin); color: #fff; border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 17px; outline: none; }
#name-input:focus { box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.3); }

/* ===== 疊加面板（圖鑑、背包、日記、開場） ===== */
#sheet { position: absolute; inset: 0; z-index: 20; background: rgba(2, 4, 8, 0.86); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px; }
#sheet.open { display: flex; }
#sheet .inner { width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; padding: 22px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); }
#sheet h3 { margin: 0 0 4px; color: var(--gold); font-size: 20px; }
#sheet .sub { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 14px; }
.cardrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.dex { border: 1px solid rgba(0, 255, 204, 0.3); border-radius: 8px; padding: 10px; text-align: left; background: none; }
.dex.locked { border-style: dashed; border-color: #334155; color: #475569; cursor: default; }
.dex b { display: block; color: #9be9d8; font-size: 14px; }
.dex small { color: var(--muted); font-size: 11px; }
.cardbody { line-height: 1.85; font-size: 15px; margin-bottom: 16px; }
.diary { background: #f5efe0; color: #3b2f1e; padding: 18px; border-radius: 6px; line-height: 2; font-size: 15px;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(59, 47, 30, 0.12) 31px 32px); margin-bottom: 14px; }
.bagitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }

<body>

<script>
// =====================================================================

const P = "pic/main/";
const SC = {
    // ---------- 起床 ----------
    "start_1": { env: "room", speaker: "人工智能", text: "早安阿～又是美好的一天。", image: "start_1.png", ix: "wake" },

        onEnter: s => { s.awake = true; } },
    "wake_2": { props: ["curtain", "console"], speaker: "人工智能", text: "趕快起床啦！太陽都要曬屁股了！快點準備登入系統！", image: "wake_2.png", n: "morning_news" },
    "morning_news": { speaker: "預報鬧鐘", text: "今天早上【宇宙太陽能板】會經過【Z市】上方，建議出門前吃維生素C避免營養不良，地表天氣預報顯示今日乾爽...",

    "c_1_b_2": { speaker: "勇者", text: "昨天玩了一天的【戰地王者】感覺好爽阿！", image: "c_1/c_1_b_2.png", n: "e_1_1" },
    "c_1_a_1": { speaker: "勇者", text: "昨天玩了一天的【戰地王者】感覺好累阿，超級不想講話的...", image: "c_1/c_1_a_2.png", n: "c_1_a_2" },
    "c_1_a_2": { speaker: "勇者", text: "早上被【預報鬧鐘】吵醒就睡不著了。", image: "c_1/c_1_a_1.png", n: "e_1_1" },

    // ---------- 朋友來電 ----------
    "e_1_1": { speaker: "勇者", text: "誰啊？這時候打來...", image: "e_1/e_1_1.png", ix: "call" },

    "c_2_a_1": { speaker: "朋友", text: "少狗腿了你！是真的正經事。", image: "c_2/c_2_a_1.png", n: "c_2_a_2" },

    "e_3_2": { speaker: "勇者", text: "（掛電話）...這算什麼理由。", image: "e_3/e_3_2.png", n: "e_3_3", sfx: "hangup" },
    "e_3_3": { speaker: "勇者", text: "伺服器是什麼阿，NPC 不是很多嗎? 查一下好了。", image: "e_3/e_3_3.png", n: "e_3_4" },
    "e_3_4": { speaker: "勇者", text: "人工智能你在嗎? 我問你喔，剛剛朋友說什麼伺服器拆分，沒有 NPC 是什麼意思？", image: "e_3/e_3_3.png", n: "e_3_5" },
    "e_3_5": { speaker: "人工智能", text: "這件事最近很火熱，是指因為人類的效率遠低於 AI NPC 太多，為了讓 AI 可以更高效地溝通合作，不用考慮人類的思考延遲，所以特別開了一個伺服器讓 AI 相互溝通。",

    "e_3_6": { speaker: "勇者", text: s => Object.keys(s.asked).length ? "嗯…還有什麼不懂的呢？" : "好多名詞都聽不懂...", image: "e_3/e_3_6.png",

            { text: "所以為什麼要拆分？", next: "c_4_a_3", if: s => !s.asked.split },

    "c_4_a_1": { speaker: "人工智能", text: "NPC 是「非玩家角色」的縮寫。2050 年開始是指所有非實體在元宇宙中行動的 AI 角色。平常你在遊戲裡的陪玩人物就是 NPC。",

    "c_4_a_2": { speaker: "人工智能", text: "伺服器就像網路世界的「大電腦」，負責存資料、處理請求、傳回結果。你上網、玩遊戲時，它都在背後運作。",

    "c_4_a_3": { speaker: "人工智能", text: "簡單說，AI 運算比人類快幾萬倍。把兩者放在一起，AI 必須「減速」等人類思考，這很浪費資源，所以才要拆分。",
        image: "c_4/c_4_a.png", n: "e_3_6", onEnter: s => { s.asked.split = true; } },

    // ---------- 出門前 ----------
    "e_4_1": { speaker: "勇者", text: "看來今天只有一個人呢。", image: "e_4/e_4_1.png", n: "e_4_2" },

    "e_4_3": { speaker: "勇者", text: "阿呀！衣服怎麼都沒洗！", image: "e_4/e_4_3.png", n: "e_4_4", fx: "shake" },
    "e_4_4": { speaker: "勇者", text: "難道要繼續穿昨天的出門！？", image: "e_4/e_4_4.png", ix: "laundry" },
    "c_5_a_1": { speaker: "人工智能", text: "提醒您，穿髒衣服可能導致細菌過多、產生異味，甚至影響人際關係。您確定要這麼做嗎？",

    "c_5_a_2": { speaker: "勇者", text: "（一個小時後，衣服洗好了）", image: "c_5/c_5_a_2.png", n: "c_5_a_4", fx: "timeskip" },

    "c_5_a_4": { speaker: "勇者", text: s => s.dirty ? "（照照鏡子）......還行吧，應該沒人聞得出來。準備出發。" : "（照照鏡子）還行，準備出發。",
        image: "c_5/c_5_a_4.png", n: "e_5_1" },

    // ---------- 街上 ----------
    "e_5_1": { props: ["sky"], env: "city", speaker: "勇者", text: "今天也是沒太陽的一天，真希望哪天可以看看真正的陽光。", image: "e_5/e_5_1.png", n: "e_5_2", sfx: "door" },
    "e_5_2": { speaker: "勇者", text: "聽說要到農業區才有太陽可以看，這裡都被高樓擋住了。", image: "e_5/e_5_2.png", n: "e_5_3" },
    "e_5_3": { speaker: "勇者", text: "（往早餐店前進）", image: "e_5/e_5_3.png", n: "e_5_4" },

    "e_5_5": { speaker: "勇者", text: "電子街？「電子」是賣什麼的啊？", image: "e_5/e_5_4.png", ix: "sign",

    "c_6_a_1": { speaker: "勇者", text: "喔喔～ 原來以前的人是在這裡買零件的啊。", image: "c_6/c_6_a_1.png", n: "c_6_a_2" },

    // ---------- 早餐店 ----------
    "c_6_a_2": { props: ["robot"], env: "cafe", speaker: "勇者", text: "到啦，店名叫「陽光早餐」。這城市沒有陽光卻有陽光早餐，呵呵。", image: "c_6/c_6_a_2.png", n: "c_6_a_3", sfx: "door" },
    "c_6_a_3": { speaker: "勇者", text: "又是無人商店啊... 進去坐吧。但我今天要吃什麼呢？", image: "c_6/c_6_a_3.png", ix: "menu" },
    "e_6_1": { speaker: "勇者", text: s => ({

    // ---------- 登入 ----------
    "e_6_3": { env: "login", speaker: "勇者", text: "熟悉的動畫....(打哈欠)", image: "e_6/e_6_3.png", n: "e_6_4", sfx: "portal" },

    "c_7_a_1": { speaker: "勇者", text: "到處走走吧，都來了。咦？那邊的草叢裡好像有東西在發光……", image: "c_7/c_7_a_1.png", ix: "grass", n: "c_7_a_2" },
    "c_7_a_2": { speaker: "勇者", text: "甚麼聲音!!! 有一個城鎮ㄟ，人工智能，幫我定位到城鎮", image: "c_7/c_7_a_2.png", n: "c_7_a_3", sfx: "chatter" },

    "e_7_8": { speaker: "梅林", text: "歡迎你來到這個NPC的世界", image: "e_7/e_7_5.png", n: s => s.dirty ? "e_7_8b" : "e_7_9" },
    "e_7_8b": { speaker: "梅林", text: "（梅林湊近掃描了一下）......你的衣服是昨天的喔。沒關係，NPC 沒有鼻子，我只是看數據。",

    "e_7_9": { speaker: "梅林", text: "我帶你去城鎮吧", image: "e_7/e_7_9.png", n: "e_7_10" },

// =====================================================================
//  聲音：全部用 Web Audio 即時合成，不需要音檔
// =====================================================================
const Snd = (() => {
    let ctx = null, master = null, noiseBuf = null, muted = false;
    const amb = {};
    const loops = {};

    function init() {
        if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.75;
        master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

        const noiseLoop = (freq, type, q = 0.7) => {
            const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
            const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
            const g = ctx.createGain(); g.gain.value = 0;
            src.connect(f).connect(g).connect(master); src.start();
            return g;
        };
        amb.rain = noiseLoop(1100, "lowpass");
        amb.radio = noiseLoop(2600, "bandpass", 3);
        amb.hum = (() => {
            const g = ctx.createGain(); g.gain.value = 0;
            [[55, 1], [110, 0.35], [165, 0.12]].forEach(([f, v]) => {
                const o = ctx.createOscillator(); o.frequency.value = f;
                const og = ctx.createGain(); og.gain.value = v;
                o.connect(og).connect(g); o.start();
            });
            g.connect(master); return g;
        })();
        amb.pad = (() => {
            const g = ctx.createGain(); g.gain.value = 0;
            const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
            [261.6, 329.6, 392.0, 493.9, 587.3].forEach((f, i) => {
                const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.detune.value = i % 2 ? 7 : -7;
                const og = ctx.createGain(); og.gain.value = 0.16;
                const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07 + i * 0.03;
                const lg = ctx.createGain(); lg.gain.value = 0.08;
                lfo.connect(lg).connect(og.gain); lfo.start();
                o.connect(og).connect(lp); o.start();
            });
            lp.connect(g); g.connect(master); return g;
        })();
    }

    function tone(f, dur = 0.15, type = "sine", vol = 0.08, delay = 0, f2) {
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(dur = 0.2, vol = 0.1, freq = 1000, type = "bandpass", delay = 0, f2) {
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
        if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f).connect(g).connect(master);
        src.start(t, Math.random()); src.stop(t + dur + 0.05);
    }

    const sfx = {
        click: () => tone(1200, 0.05, "square", 0.03),
        tap: () => tone(700, 0.06, "sine", 0.06),
        coin: () => { tone(988, 0.12, "square", 0.05); tone(1319, 0.3, "square", 0.05, 0.08); },
        ding: () => { tone(1047, 0.5, "sine", 0.08); tone(1568, 0.6, "sine", 0.05, 0.05); },
        error: () => { tone(180, 0.18, "square", 0.06); tone(120, 0.25, "square", 0.06, 0.12); },
        glitch: () => { noise(0.5, 0.25, 3000, "highpass"); for (let i = 0; i < 6; i++) tone(100 + Math.random() * 1500, 0.06, "square", 0.04, i * 0.07); },
        hangup: () => { tone(440, 0.12, "sine", 0.06); tone(440, 0.12, "sine", 0.06, 0.2); tone(440, 0.12, "sine", 0.06, 0.4); },
        door: () => { noise(0.4, 0.12, 400, "lowpass"); tone(1760, 0.3, "sine", 0.03, 0.05); tone(1397, 0.4, "sine", 0.03, 0.2); },
        portal: () => { tone(200, 1.2, "sine", 0.07, 0, 1200); noise(1.2, 0.08, 300, "bandpass", 0, 4000); },
        wash: () => { for (let i = 0; i < 5; i++) noise(0.35, 0.1, 500, "lowpass", i * 0.3); },
        lamp: () => { tone(220, 0.4, "sawtooth", 0.04, 0, 880); tone(1760, 0.6, "sine", 0.05, 0.35); },
        lever: () => { noise(0.08, 0.2, 2500, "bandpass"); tone(160, 0.08, "square", 0.04); },
        pick: () => { noise(0.08, 0.35, 3500, "bandpass"); tone(320, 0.08, "triangle", 0.08); },
        crack: () => { noise(0.4, 0.3, 800, "lowpass"); tone(1500, 0.4, "sine", 0.05, 0.1); },
        clank: () => { tone(900, 0.25, "square", 0.04); tone(1350, 0.25, "square", 0.03, 0.01); },
        burp: () => tone(140, 0.45, "sawtooth", 0.1, 0, 60),
        buy: () => { tone(660, 0.08, "square", 0.04); tone(880, 0.08, "square", 0.04, 0.08); tone(1320, 0.2, "square", 0.04, 0.16); },
        wake: () => tone(330, 0.5, "sine", 0.05, 0, 520),
        open: () => tone(200, 2.4, "sine", 0.05, 0, 900),
        chatter: () => { for (let i = 0; i < 16; i++) tone(1400 + Math.random() * 1800, 0.03, "square", 0.025, i * 0.04); }
    };

    // 角色說話時的「聲音」
    const voices = {
        "勇者": [210, "triangle", 0.05], "人工智能": [560, "sine", 0.05], "預報鬧鐘": [620, "square", 0.02],
        "朋友": [300, "triangle", 0.05], "梅林": [760, "sine", 0.05], "村民": [1600, "square", 0.02],
        "系統": [880, "square", 0.02], "商店 NPC": [820, "sine", 0.04]
    };
    function blip(speaker) {
        const v = voices[speaker]; if (!v) return;
        tone(v[0] * (0.9 + Math.random() * 0.25), 0.05, v[1], v[2]);
    }

    function setAmb(levels) {
        if (!ctx) return;
        for (const k in amb) amb[k].gain.setTargetAtTime(levels[k] || 0, ctx.currentTime, 0.6);
    }

    // 重複的聲音（鬧鐘、電話、NPC 世界的資料鳥叫）
    function loop(name, on) {
        if (!on) { clearInterval(loops[name]); clearTimeout(loops[name]); delete loops[name]; return; }
        if (loops[name]) return;
        if (name === "alarm") loops[name] = setInterval(() => { tone(880, 0.1, "square", 0.04); tone(1320, 0.1, "square", 0.04, 0.15); }, 900);
        if (name === "ring") loops[name] = setInterval(() => { for (let i = 0; i < 6; i++) tone(i % 2 ? 620 : 480, 0.08, "sine", 0.06, i * 0.09); }, 1600);
        if (name === "chirps") {
            const go = () => {
                const base = 2000 + Math.random() * 1500;
                for (let i = 0; i < 2 + Math.random() * 3; i++) tone(base + i * 120, 0.05, "sine", 0.018, i * 0.07);
                loops[name] = setTimeout(go, 1500 + Math.random() * 3500);
            };
            go();
        }
    }

    function toggle() {
        muted = !muted;
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.75, ctx.currentTime, 0.05);
        return muted;
    }

    return { init, sfx: n => sfx[n] && sfx[n](), blip, setAmb, loop, toggle, get ready() { return !!ctx; } };
})();

//  粒子：雨、灰塵、陽光閃點、二進位
// =====================================================================
const Particles = (() => {
    const cv = $("fxc"), g = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let mode = "none", ps = [], W = 0, H = 0, burstUntil = 0;
    function resize() { W = cv.width = stage.clientWidth * devicePixelRatio; H = cv.height = stage.clientHeight * devicePixelRatio; }
    new ResizeObserver(resize).observe(stage);
    function spawn() {
        const r = Math.random;
        if (mode === "rain") return { x: r() * W * 1.2, y: r() * -H, v: (9 + r() * 6) * devicePixelRatio, l: (10 + r() * 14) * devicePixelRatio };
        if (mode === "dust") return { x: r() * W, y: r() * H, vx: (r() - 0.5) * 0.25, vy: -0.1 - r() * 0.2, a: r() * 0.5, sz: (1 + r() * 2) * devicePixelRatio };
        if (mode === "sun") return { x: r() * W, y: r() * H, vx: 0.15 + r() * 0.2, vy: -0.08 - r() * 0.15, a: r(), sz: (1.5 + r() * 2.5) * devicePixelRatio, t: r() * 6 };
        if (mode === "binary") return { x: r() * W, y: r() * H, v: (0.4 + r() * 1.2) * devicePixelRatio, c: r() > 0.5 ? "1" : "0", a: 0.15 + r() * 0.35 };
        return null;
    }
    function set(m) {
        if (m === mode) return;
        mode = m; ps = [];
        const n = { rain: 140, dust: 50, sun: 60, binary: 70 }[m] || 0;
        for (let i = 0; i < (reduce ? n / 4 : n); i++) { const p = spawn(); if (p) { if (m === "rain") p.y = Math.random() * H; ps.push(p); } }
    }
    function burst() { burstUntil = performance.now() + 2200; }
    function frame(t) {
        g.clearRect(0, 0, W, H);
        if (mode === "rain") {
            g.strokeStyle = "rgba(170,190,220,0.35)"; g.lineWidth = devicePixelRatio;
            g.beginPath();
            for (const p of ps) {
                p.y += p.v; p.x -= p.v * 0.25;
                if (p.y > H) { p.y = -20; p.x = Math.random() * W * 1.2; }
                g.moveTo(p.x, p.y); g.lineTo(p.x - p.l * 0.25, p.y + p.l);
            }
            g.stroke();
        } else if (mode === "dust" || mode === "sun") {
            for (const p of ps) {
                p.x += p.vx; p.y += p.vy;
                if (p.y < -10 || p.x > W + 10) { Object.assign(p, spawn()); p.y = H + 5; }
                const a = mode === "sun" ? 0.35 + 0.35 * Math.sin(t / 700 + p.t) : p.a;
                g.fillStyle = mode === "sun" ? `rgba(255,248,210,${a})` : `rgba(255,240,200,${a * 0.6})`;
                g.beginPath(); g.arc(p.x, p.y, p.sz, 0, 7); g.fill();
            }
        } else if (mode === "binary") {
            g.font = `${12 * devicePixelRatio}px monospace`;
            for (const p of ps) {
                p.y += p.v; if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
                g.fillStyle = `rgba(0,255,204,${p.a})`; g.fillText(p.c, p.x, p.y);
            }
        }
        // 村民講話時噴出的 0 與 1
        if (t < burstUntil) {
            g.font = `bold ${16 * devicePixelRatio}px monospace`;
            for (let i = 0; i < 6; i++) {
                g.fillStyle = `rgba(244,114,182,${Math.random()})`;
                g.fillText(Math.random() > 0.5 ? "1" : "0", W * (0.2 + Math.random() * 0.6), H * (0.15 + Math.random() * 0.5));
            }
        }
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return { set, burst };
})();

// =====================================================================
//  場景流程
// =====================================================================
let typing = false, typeTimer = null, fullText = "", afterType = null;
let canAdvance = false, ix = null, sheetOpen = false, started = false;

function go(id) {
    if (!id) return;
    if (id.endsWith(".html")) { save(); location.href = id; return; }
    if (!SC[id]) { toast("找不到場景：" + id); return; }
    curId = id; cur = SC[id];
    enter(cur);
    save();
}

function enter(sc) {
    if (ix && ix.cleanup) ix.cleanup();
    ix = null; IXL.innerHTML = ""; $("choices").innerHTML = ""; hint("");
    canAdvance = false; $("more").classList.remove("on");
    idleSaid = false;
    $("exposure").style.opacity = 0;
    setLids(0);

    if (sc.onEnter) sc.onEnter(s);
    applyEnv(sc.env || envName);
    if (sc.card) collect(sc.card);
    if (sc.sfx) Snd.sfx(sc.sfx);
    if (sc.fx) fx(sc.fx);

    const img = $("scene-img");
    if (sc.image && !img.src.endsWith(sc.image)) { img.style.opacity = 0; img.src = sc.image; }

    $("speaker").textContent = sc.speaker === "勇者" && s.name ? s.name : sc.speaker;
    $("speaker").style.color = speakerColor[sc.speaker] || "#00ffcc";
    $("text").textContent = "";
    $("text").classList.toggle("thinking", sc.speaker === "勇者" && /^（/.test(resolve(sc.text) || ""));

    const def = sc.ix ? IX[sc.ix] : null;
    if (def && def.when === "first") {
        ix = def.mount(sc) || {};
        ix.resume = () => { $("speaker").textContent = sc.speaker === "勇者" && s.name ? s.name : sc.speaker; typeOut(sc, () => afterText(sc)); };
    } else {
        if (def && def.when === "enter") ix = def.mount(sc) || {};
        typeOut(sc, () => afterText(sc));
    }
}

function typeOut(sc, done) {
    clearTimeout(typeTimer);
    fullText = fill(resolve(sc.text));
    afterType = done;
    typing = true;
    const t = $("text");
    const speed = { "梅林": 22, "村民": 10, "系統": 14 }[sc.speaker] || 32;
    const scramble = sc.fx === "scramble";
    const glyphs = "▓▒░01#@$%&*";
    let i = 0;
    const step = () => {
        if (scramble) {
            const rest = fullText.slice(i).replace(/\S/g, () => glyphs[Math.floor(Math.random() * glyphs.length)]);
            t.textContent = fullText.slice(0, i) + rest.slice(0, 6);
        } else t.textContent = fullText.slice(0, i);
        if (i % 2 === 0 && fullText[i] && !/[\s，。！？…、.!?]/.test(fullText[i])) Snd.blip(sc.speaker);
        $("text-wrap").scrollTop = 1e6;
        if (i++ < fullText.length) typeTimer = setTimeout(step, scramble ? 70 : speed);
        else finishTyping();
    };
    step();
}
function finishTyping() {
    clearTimeout(typeTimer);
    $("text").textContent = fullText;
    if (!typing) return;
    typing = false;
    const f = afterType; afterType = null;
    if (f) f();
}

function afterText(sc) {
    const def = sc.ix ? IX[sc.ix] : null;
    if (def && def.when === "after") ix = def.mount(sc) || {};
    if (sc.choices) renderChoices(sc);
    canAdvance = !!sc.n && !(ix && ix.lock);
    $("more").classList.toggle("on", canAdvance);
}

function renderChoices(sc) {
    const box = $("choices"); box.innerHTML = "";
    const style = ENV[envName].world === "human" ? "thought" : "holo-c";
    visibleChoices(sc).forEach((c, i) => {
        const b = el("button", `choice ${style}`, `<span class="k">${i + 1}</span>${fill(resolve(c.text))}`);
        b.style.animationDelay = (i * 0.08) + "s";
        b.onclick = e => { e.stopPropagation(); pick(c); };
        box.appendChild(b);
    });
    if (style === "holo-c") Snd.sfx("click");
}
const visibleChoices = sc => (sc.choices || []).filter(c => !c.if || c.if(s));
function pick(c) {
    Snd.sfx("tap");
    if (c.effect) c.effect(s);
    go(resolve(c.next));
}

function advance() {
    if (typing) { finishTyping(); return; }
    if (ix && ix.onTap) { ix.onTap(); return; }
    if (canAdvance) { Snd.sfx("click"); go(resolve(cur.n)); }
}

// 點畫面或對話框前進
[stage, $("dialog")].forEach(z => z.addEventListener("click", e => {
    if (!started || sheetOpen) return;
    if (e.target.closest("button, input, .holo, .tag")) return;
    markActive();
    advance();
}));
stage.addEventListener("pointerdown", e => { if (ix && ix.onDown && !e.target.closest("button")) ix.onDown(); });
window.addEventListener("pointerup", () => { if (ix && ix.onUp) ix.onUp(); });

document.addEventListener("keydown", e => {
    if (!started) return;
    markActive();
    if (e.target.tagName === "INPUT") return;
    if (e.key === "m" || e.key === "M") { toggleSound(); return; }
    if (sheetOpen) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        if (ix && ix.onDown && !e.repeat) ix.onDown();
        else if (!e.repeat) advance();
        return;
    }
    if (/^[1-9]$/.test(e.key) && !typing) {
        const c = visibleChoices(cur)[+e.key - 1];
        if (c) pick(c);
    }
});
document.addEventListener("keyup", e => { if ((e.key === " " || e.key === "Enter") && ix && ix.onUp) ix.onUp(); });

//  when: "enter" 進場就出現；"after" 台詞打完才出現；"first" 先玩完才出現台詞
//  mount 回傳 { lock, onTap, onDown, onUp, cleanup }

function tag(x, y, label, onTap, cls = "") {
    const t = el("button", "tag " + cls, `<span class="dot"></span>${label}`);
    t.style.left = x + "%"; t.style.top = y + "%";
    t.onclick = e => { e.stopPropagation(); markActive(); onTap(t); };
    IXL.appendChild(t);
    return t;
}
function holo(css, html) {
    const h = el("div", "holo", html);
    Object.assign(h.style, css);
    h.addEventListener("click", e => e.stopPropagation());
    IXL.appendChild(h);
    return h;
}

        const connect = async () => {
            const R = L[lv];
            const miss = [[0, 0], [0, 1], [1, 0], [1, 1]].find(([a, b]) => G[pick](a, b) !== G[R.ans](a, b));
            if (miss) {
                Snd.sfx("error"); fx("shake");
                const [a, b] = miss;
                say("梅林", `A=${a}、B=${b} 的時候，燈${G[pick](a, b) ? "不應該" : "應該要"}亮喔。撥撥看開關試試。`);
                return;
            }
            s.mineLit++; Snd.sfx("lamp"); refreshEnv();
            if (!s.visited.includes("mine")) addCoins(1, `${pick} 閘`);
            else say("梅林", "這盞燈亮了！（彼特幣只有第一次有喔）");
            lv++; pick = null; A = 0; B = 0;
            if (lv < L.length) { draw(); return; }
            h.remove();
            if (!s.visited.includes("mine")) s.visited.push("mine");
            say("梅林", "整個礦坑都亮起來了！");
            await wait(1600);
            go("m_2");
        };
        hint("撥動 A、B 測試，選對邏輯閘再接上電路");
        draw();
        return { lock: true };
    } },

    // --- 挖礦場：敲對的礦石 ---
    quiz: { when: "after", mount() {
        const bank = shuffle([
            { q: "NPC 是什麼的縮寫？", a: "非玩家角色", w: ["新人類程式", "網路處理中心", "數位寵物"] },
            { q: "晶片裡的電晶體「通電」代表哪個數字？", a: "1", w: ["0", "2", "10"] },
            { q: "二進位 01001000 等於多少？", a: "72", w: ["48", "100", "8"] },
            { q: "「兩個開關都打開，燈才會亮」是哪種邏輯閘？", a: "AND", w: ["OR", "XOR", "NOT"] },
            { q: "為什麼要把 AI 和人類的伺服器拆開？", a: "AI 不用等人類", w: ["人類太吵", "伺服器不夠", "AI 討厭人類"] },
            { q: "CPU 和 GPU 分工合作，這種設計叫做？", a: "異質整合", w: ["量子糾纏", "雲端備份", "超頻"] },
            { q: "哪一個電子零件像「用電控制的開關」？", a: "電晶體", w: ["電阻", "電容", "電池"] }
        ]).slice(0, 5);
        const first = !s.visited.includes("quiz");
        const spots = [[26, 56], [72, 52], [34, 82], [68, 84]];
        let i = 0, got = 0, timer = null;
        const head = holo({ left: "50%", top: "4%", transform: "translateX(-50%)", width: "min(520px, 92%)" }, "");
        head.style.animation = "none";
        const ask = () => {
            IXL.querySelectorAll(".rock").forEach(r => r.remove());
            const it = bank[i];
            head.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:12px;color:#9be9d8;margin-bottom:6px"><span>第 ${i + 1} / 5 塊礦脈</span><span>⛏ ${got}</span></div>
                <div style="font-weight:700;font-size:15px;margin-bottom:8px">${it.q}</div><div class="fuel"><div id="fuel" style="width:100%"></div></div>`;
            let left = 100, over = false;
            const rocks = shuffle([it.a, ...it.w]).map((txt, k) => {
                const r = el("button", "rock", txt);
                r.style.left = spots[k][0] + "%"; r.style.top = spots[k][1] + "%";
                r.onclick = e => { e.stopPropagation(); end(r); };
                IXL.appendChild(r);
                return r;
            });
            const end = r => {
                if (over) return; over = true; clearInterval(timer);
                const right = rocks.find(x => x.textContent === it.a);
                if (r === right) {
                    got++; Snd.sfx("pick"); setTimeout(() => Snd.sfx("crack"), 120);
                    r.classList.add("gem", "hit");
                    const c = el("div", "coinpop", "🪙"); c.style.left = r.style.left; c.style.top = r.style.top; IXL.appendChild(c);
                } else {
                    if (r) { Snd.sfx("clank"); r.classList.add("hit", "dud"); fx("shake"); }
                    else Snd.sfx("error");
                    right.classList.add("gem");
                }
                setTimeout(() => { i++; i < 5 ? ask() : done(); }, 1000);
            };
            timer = setInterval(() => {
                left -= 1;
                const f = $("fuel"); if (f) f.style.width = left + "%";
                if (left <= 0) end(null);
            }, 100);
        };
        const done = () => {
            s.quizLast = got;
            if (first) { s.visited.push("quiz"); if (got) addCoins(got, "挖礦收穫"); }
            go("q_2");
        };
        hint("敲開寫著正確答案的礦石");
        ask();
        return { lock: true, cleanup: () => clearInterval(timer) };
    } },

    // --- 商店貨架 ---
    shop: { when: "after", mount() {
        const wares = [
            { id: "cola", icon: "🥤", name: "合成可樂", price: 1, x: 22 },
            { id: "badge", icon: "🔰", name: "AND 閘徽章", price: 2, x: 50 },
            { id: "diary", icon: "📕", name: "梅林的祕密日記", price: 4, x: 78 }
        ];
        const lines = { cola: "喝起來有一點電池味喔。", badge: "戴著它，NPC 會對你比較友善。", diary: "這本......是怎麼跑到貨架上的？" };
        const draw = () => {
            IXL.querySelectorAll(".ware").forEach(w => w.remove());
            wares.forEach(w => {
                const owned = s.items.includes(w.id) || (w.id === "cola" && s.drankCola);
                const d = el("div", "ware" + (owned ? " sold" : ""), `<div class="icon">${w.icon}</div>
                    <div style="font-size:13px;font-weight:700;text-shadow:0 1px 4px #000">${w.name}</div>
                    <button class="hbtn pricetag ${owned ? "" : "gold"}">${owned ? "已購買" : "🪙 " + w.price}</button>`);
                d.style.left = w.x + "%"; d.style.top = "46%";
                const btn = d.querySelector("button");
                btn.onclick = e => {
                    e.stopPropagation();
                    if (owned) return;
                    if (s.coins < w.price) { Snd.sfx("error"); say("商店 NPC", `還差 ${w.price - s.coins} 枚彼特幣喔，去挖礦場看看？`); return; }
                    s.coins -= w.price; s.items.push(w.id); updateHud(); Snd.sfx("buy");
                    say("商店 NPC", lines[w.id] + "（已放進背包）");
                    save(); draw();
                };
                IXL.appendChild(d);
            });
        };
        draw();
        tag(86, 12, "離開商店", () => go("s_2"));
        hint("買到的東西會放進右上角的 🎒");
        return { lock: true };
    } },

    // --- 結局 ---
    ending: { when: "after", mount() {
        const row = el("div", "", "");
        row.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap";
        const again = el("button", "hbtn gold", "從頭再玩一次");
        again.onclick = e => { e.stopPropagation(); clearSave(); location.reload(); };
        const back = el("button", "hbtn", "回到 NPC 城鎮");
        back.onclick = e => { e.stopPropagation(); go("e_9_9"); };
        row.append(again, back);
        $("choices").appendChild(row);
        return { lock: true };
    } }
};

// 進場時順便放上可探索物件
const _enter = enter;
enter = function (sc) { _enter(sc); mountProps(sc); };

// =====================================================================
//  HUD：登出、背包、圖鑑、聲音
// =====================================================================
$("logout-btn").onclick = e => {
    e.stopPropagation(); markActive();
    s.logout++; fx("glitch");
    say("系統", `⚠ 登出失敗（第 ${s.logout} 次）：NPC 伺服器拒絕放走唯一的人類。`);
    if (s.logout === 3) setTimeout(() => say("梅林", "又想走了？這裡有太陽耶。"), 3200);
    if (s.logout === 5) setTimeout(() => say("梅林", "偷偷告訴你，那個按鈕其實是裝飾用的。想回家可以去城鎮地圖喔。"), 3200);
    save();
};

function openSheet(html) { $("sheet-inner").innerHTML = html; $("sheet").classList.add("open"); sheetOpen = true; }
function closeSheet() { $("sheet").classList.remove("open"); sheetOpen = false; }
$("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

function openDex() {
    const ids = Object.keys(CARDS);
    openSheet(`<h3>📖 掃描紀錄</h3><div class="sub">已掃描 ${collected.length} / ${ids.length}。在劇情裡多問、多看、多點，就能掃描到更多。挖礦場的題目也都出自這裡。</div>
        <div class="cardrow">${ids.map(id => collected.includes(id)
            ? `<button class="dex" data-c="${id}"><b>${CARDS[id].title}</b><small>點擊閱讀</small></button>`
            : `<div class="dex locked"><b style="color:#475569">？？？</b><small>尚未掃描</small></div>`).join("")}</div>
        <button class="hbtn" style="width:100%" id="x">關閉</button>`);
    $("sheet-inner").querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        const c = CARDS[b.dataset.c];
        openSheet(`<h3>${c.title}</h3><div class="cardbody">${c.body}</div><button class="hbtn" style="width:100%" id="x">返回</button>`);
        $("x").onclick = openDex;
    });
    $("x").onclick = closeSheet;
}

function openBag() {
    const info = {
        cola: ["🥤 合成可樂", "喝掉", () => { s.items = s.items.filter(i => i !== "cola"); s.drankCola = true; Snd.sfx("burp"); closeSheet(); say("勇者", "（喝了一口）……嗝～（8-bit 的聲音）"); }],
        badge: ["🔰 AND 閘徽章", () => s.wearing ? "已戴上" : "戴上", () => { s.wearing = true; Snd.sfx("ding"); closeSheet(); if (buddyKind() === "merlin") say("梅林", "喔！AND 閘徽章！很適合你。"); }],
        diary: ["📕 梅林的祕密日記", "閱讀", () => {
            s.readDiary = true; Snd.sfx("wash");
            openSheet(`<h3>梅林的日記</h3><div class="diary">2111.05.23<br>明天終於要拆分伺服器了。<br>人類的選單，我請工程 NPC 動了一點手腳。<br>如果有人類「不小心」點進來……<br>那就是計畫開始的時候。<br><span style="opacity:.5">（後面幾頁被撕掉了）</span></div><button class="hbtn" id="x" style="width:100%">闔上</button>`);
            $("x").onclick = closeSheet;
            save();
        }]
    };
    const list = s.items.map(id => {
        const [n, act] = info[id];
        const label = resolve(act);
        return `<div class="bagitem"><span>${n}</span><button class="hbtn" data-use="${id}" ${label === "已戴上" ? "disabled" : ""}>${label}</button></div>`;
    }).join("");
    openSheet(`<h3>🎒 背包</h3><div class="sub">${s.items.length ? "可以在任何時候使用。" : "還是空的。城鎮的商店可以用彼特幣買東西。"}</div>${list}<button class="hbtn" style="width:100%;margin-top:6px" id="x">關閉</button>`);
    $("sheet-inner").querySelectorAll("[data-use]").forEach(b => b.onclick = () => info[b.dataset.use][2]());
    $("x").onclick = closeSheet;
}

function toggleSound() { const m = Snd.toggle(); $("snd-btn").textContent = m ? "🔇" : "🔊"; }
$("dex-btn").onclick = e => { e.stopPropagation(); openDex(); };
$("bag-btn").onclick = e => { e.stopPropagation(); openBag(); };
$("coin-hud").onclick = e => { e.stopPropagation(); toast(`🪙 你有 ${s.coins} 枚彼特幣`); };
$("snd-btn").onclick = e => { e.stopPropagation(); toggleSound(); };
$("hud").addEventListener("click", e => e.stopPropagation());

// =====================================================================
//  開場
// =====================================================================
(function boot() {
    const d = new Date();
    $("date").textContent = `2111.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    const saved = loadSave();
    const btns = $("title-btns");
    const begin = (fromSave) => {
        Snd.init(); started = true;
        $("title").classList.add("hide");
        setTimeout(() => $("title").remove(), 1000);
        if (fromSave) {
            s = Object.assign(fresh(), saved.s); collected = saved.collected || []; envName = saved.env || "room";
            // 存在中途小遊戲的話，從那一幕重新開始即可
            go(saved.id);
            setTimeout(() => { const k = buddyKind(); if (k) say(k === "ai" ? "人工智能" : "梅林", `歡迎回來${s.name ? "，" + s.name : ""}。`); }, 1500);
        } else {
            clearSave();
            setLids(1);
            go("start_1");
        }
    };
    const start = el("button", "hbtn gold", saved ? "重新開始" : "戴上耳機，登入");
    start.style.padding = "12px 22px";
    start.onclick = () => begin(false);
    if (saved) {
        const cont = el("button", "hbtn", "繼續冒險");
        cont.style.padding = "12px 22px";
        cont.onclick = () => begin(true);
        btns.appendChild(cont);
    }
    btns.appendChild(start);
    applyEnv("room");
    updateHud();
})();
</script>
